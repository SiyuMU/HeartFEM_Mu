# Environment CONDA_ENV of HeartFEM_Mu (Python 3.11): preprocessing, the PINN (torch 2.5.1, CUDA 12.1 wheels) and all
# figures. Exact versions of the environment that produced the example outputs (linux-64).
# Install with environments/install.sh (also links ffmpeg, see there), or: conda env create -f pinn_stress.yml
name: pinn_stress
channels:
  - conda-forge
  - nodefaults
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.7.22
  - ld_impl_linux-64=2.46.1
  - libexpat=2.8.5
  - libffi=3.7.0
  - libgcc=16.2.0
  - libgomp=16.2.0
  - liblzma=5.8.3
  - libnsl=2.0.1
  - libpython=3.11.16
  - libsqlite=3.53.4
  - libstdcxx=16.2.0
  - libuuid=2.42.4
  - libxcrypt=4.4.38
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.6.5
  - packaging=26.3
  - pip=26.2.1
  - python=3.11.16
  - readline=8.3
  - setuptools=84.0.0
  - tk=8.6.13
  - tzdata=2026c
  - wheel=0.48.0
  - zstd=1.5.7
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - contourpy==1.3.3
      - cycler==0.12.1
      - filelock==3.32.3
